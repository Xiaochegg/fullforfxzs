<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- ✅ 允许缩放：移除 user-scalable=no，符合 WCAG 无障碍标准 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MC PVP 排行榜 - Minecraft 剑斗/盾斧/药水/水晶多模式对战榜单</title>
<!-- ===== SEO Meta ===== -->
<meta name="description" content="Minecraft PVP 排行榜：剑斗、盾斧、钻石药水、合金药水、重锤、水晶、嘉豪、心动八大独立模式，HT/LT 五级段位体系，总榜积分汇总，心动榜每日点赞。">
<meta name="keywords" content="Minecraft,我的世界,PVP,排行榜,剑斗,盾斧,钻石药水,合金药水,重锤,水晶,段位,心动榜">
<meta name="author" content="Operit">
<meta name="robots" content="index,follow">
<!-- ===== Open Graph 社交分享卡片 ===== -->
<meta property="og:type" content="website">
<meta property="og:title" content="MC PVP 排行榜">
<meta property="og:description" content="八大独立 PVP 模式 · HT/LT 五级段位 · 心动每日点赞，快来查看你的排名！">
<meta property="og:site_name" content="MC PVP 排行榜">
<meta property="og:url" content="https://xiaochegg.github.io/fullforfxzs/">
<meta property="og:image" content="https://xiaochegg.github.io/fullforfxzs/og-cover.png">
<!-- ===== 主题色 / PWA 基础 ===== -->
<meta name="theme-color" content="#14141c">
<link rel="icon" href="assets/items/sword.png">
<!--
  Minecraft PVP 排行榜 · 单页应用（前端演示版）
  ─────────────────────────────────────────
  ▸ 数据存储：localStorage（键 mc_pvp_db_v1）
  ▸ 后端对接：app.js 底部 API 对接区，实现 fetch 后替换即可
  ▸ 制作者：Operit
-->
<link rel="stylesheet" href="style.css">
<!-- Apple Liquid Glass 动效层（叠加覆盖） -->
<link rel="stylesheet" href="glass.css">
</head>
<body>
<div id="app">

  <!-- ════════ 顶部导航栏（5入口） ════════ -->
  <header class="topbar" id="topbar">
    <!-- ✅ h1：页面唯一主标题（SEO + 读屏） -->
    <h1 class="logo px-title"><img class="mc-ic ic-logo" src="assets/items/sword.png" alt="" aria-hidden="true">PVP榜</h1>
    <nav class="nav-btns" aria-label="功能导航">
      <button class="nav-item" data-nav="theme" aria-pressed="false"><span class="ic"><img class="mc-ic ic-nav" src="assets/items/theme.png" alt="" aria-hidden="true"></span>主题</button>
      <button class="nav-item" data-nav="diy" aria-pressed="false"><span class="ic"><img class="mc-ic ic-nav" src="assets/items/diy.png" alt="" aria-hidden="true"></span>DIY</button>
      <button class="nav-item" data-nav="music" aria-pressed="false"><span class="ic"><img class="mc-ic ic-nav" src="assets/items/music.png" alt="" aria-hidden="true"></span>音乐</button>
      <button class="nav-item" data-nav="about" aria-pressed="false"><span class="ic"><img class="mc-ic ic-nav" src="assets/items/about.png" alt="" aria-hidden="true"></span>关于</button>
      <button class="nav-item" data-nav="admin" aria-pressed="false"><span class="ic"><img class="mc-ic ic-nav" src="assets/items/admin.png" alt="" aria-hidden="true"></span>管理</button>
    </nav>
  </header>

  <!-- ════════ 内容区 ════════ -->
  <main class="main" id="mainContent">

    <!-- 下拉刷新指示器（顶部固定，意图闸门专用） -->
    <div id="ptrIndicator" class="ptr-indicator" aria-hidden="true">
      <span class="ptr-ring" id="ptrRing"></span>
      <span class="ptr-text" id="ptrText">下拉刷新</span>
    </div>

    <!-- 玻璃拟态滑动模式栏（外层容器持玻璃外观 + overflow:hidden） -->
    <div class="mode-bar-wrap" id="modeBarWrap">
      <div class="mode-bar" id="modeBar" role="tablist" aria-label="排行榜模式切换">
        <div class="mode-glider" id="modeGlider" aria-hidden="true"></div>
        <button class="mode-item on" data-mode="sword" role="tab" aria-selected="true"><img class="mc-ic ic-tab" src="assets/items/sword.png" alt="" aria-hidden="true">剑斗</button>
        <button class="mode-item" data-mode="axe" role="tab" aria-selected="false"><img class="mc-ic ic-tab" src="assets/items/axe.png" alt="" aria-hidden="true">盾斧</button>
        <button class="mode-item" data-mode="diamond" role="tab" aria-selected="false"><img class="mc-ic ic-tab" src="assets/items/potion_diamond.png" alt="" aria-hidden="true">钻石药水</button>
        <button class="mode-item" data-mode="alloy" role="tab" aria-selected="false"><img class="mc-ic ic-tab" src="assets/items/potion_alloy.png" alt="" aria-hidden="true">合金药水</button>
        <button class="mode-item" data-mode="hammer" role="tab" aria-selected="false"><img class="mc-ic ic-tab" src="assets/items/hammer.png" alt="" aria-hidden="true">重锤</button>
        <button class="mode-item" data-mode="crystal" role="tab" aria-selected="false"><img class="mc-ic ic-tab" src="assets/items/crystal.png" alt="" aria-hidden="true">水晶</button>
        <button class="mode-item" data-mode="jiahao" role="tab" aria-selected="false"><img class="mc-ic ic-tab" src="assets/items/jiahao.png" alt="" aria-hidden="true">嘉豪</button>
        <button class="mode-item" data-mode="heart" role="tab" aria-selected="false"><img class="mc-ic ic-tab" src="assets/items/heart.png" alt="" aria-hidden="true">心动</button>
        <button class="mode-item" data-mode="total" role="tab" aria-selected="false"><img class="mc-ic ic-tab" src="assets/items/total.png" alt="" aria-hidden="true">总榜</button>
      </div>
    </div>

    <!-- 登录/个人面板 -->
    <section id="userPanel" class="user-panel mc-panel hidden" aria-live="polite"></section>

    <!-- 榜单标题 -->
    <div class="list-head">
      <h2 class="px-title" id="listTitle"><img class="mc-ic ic-md" src="assets/items/sword.png" alt="" aria-hidden="true"> 剑斗模式</h2>
      <span class="list-sub" id="listSub">段位独立计算 · 实时更新</span>
    </div>

    <!-- 榜单列表 -->
    <div class="list-scroll" id="listWrap">
      <div id="listContent"></div>
      <div id="pullTip" class="pull-tip">顶部用力下拉可刷新</div>
    </div>
  </main>

  <!-- ✅ Footer：版权/版本/备案 -->
  <footer class="site-footer">
    <span><img class="mc-ic ic-sm" src="assets/items/sword.png" alt="" aria-hidden="true"> MC PVP 排行榜 v1.1.0</span>
    <span>© <span id="footerYear">2026</span> Operit · 前端演示版 · 数据存于本机</span>
  </footer>

  <!-- 底部安全区 -->
  <div class="safe-foot"></div>
</div>

<!-- 悬浮迷你播放条 -->
<div id="miniPlayer" class="mini-player hidden" role="region" aria-label="音乐播放条">
  <button id="mpBtn" class="mp-btn" aria-label="播放/暂停"><img class="mc-ic ic-sm" src="assets/items/music.png" alt="" aria-hidden="true"></button>
  <div class="mp-info"><span id="mpName">MC 轻音乐</span><span class="mp-bar"><i id="mpBar"></i></span></div>
  <button id="mpClose" class="mp-btn" aria-label="关闭播放条">✕</button>
</div>

<!-- ════════ 弹窗容器 ════════ -->
<div id="overlay" class="overlay hidden"></div>
<div id="dialogRoot"></div>

<!-- 粒子层 -->
<div class="particle-layer" id="particles" aria-hidden="true"></div>

<script src="app.js"></script>
</body>
</html>
